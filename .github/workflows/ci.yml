name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Headers needed by gpui (windowing, fonts), whisper.cpp (cmake,
      # libclang) and cpal (ALSA); ffmpeg for the media engine tests.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libclang-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libfontconfig1-dev libfreetype-dev libvulkan-dev \
            libasound2-dev libdbus-1-dev ffmpeg

      # Installs the version pinned by rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: CI
        run: ./scripts/ci.sh

  platforms:
    name: build, clippy, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # macOS: Xcode's clang and the runner's cmake; Windows: MSVC, cmake and
      # LLVM (libclang for bindgen) come with the runner image.
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The model-free crates; the app and the media pipeline are covered by
      # the Linux job (they need a display, Chromium and long runs).
      - name: Tests
        run: >
          cargo test --locked
          -p enfait-core -p enfait-config -p enfait-speech -p enfait-ai
          -p enfait-mcp -p enfait-media

      - name: Release build
        run: cargo build --release --locked -p enfait-app -p enfait-cli

  deny:
    name: licences and advisories (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
