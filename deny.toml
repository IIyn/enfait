# Configuration de cargo-deny : vulnérabilités connues, licences, sources.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Les crates abandonnées ne sont signalées que si nous en dépendons
# directement : celles qui viennent de gpui ou de chromiumoxide ne se
# remplacent pas de notre côté.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
