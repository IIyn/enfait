"connect.auto":
  en: "Checked automatically: each step ticks itself off as soon as it is done, no need to reopen this page."
  fr: "Vérifié automatiquement : chaque étape se coche dès qu'elle est faite, inutile de rouvrir cette page."
"connect.checking":
  en: "Checking…"
  fr: "Vérification…"
"connect.claude.account":
  en: "Needs a Claude subscription (Pro, Max, Team, Enterprise) or an Anthropic Console account."
  fr: "Demande un abonnement Claude (Pro, Max, Team, Enterprise) ou un compte Anthropic Console."
"connect.claude.api_first":
  en: "An Anthropic key is set: in \"Auto\", enfait uses the API first. Choose \"Claude Code\" above to use your subscription."
  fr: "Une clé Anthropic existe : en « Auto », enfait passe d'abord par l'API. Choisis « Claude Code » plus haut pour utiliser ton abonnement."
"connect.claude.in_use":
  en: "enfait uses Claude Code."
  fr: "enfait utilise Claude Code."
"connect.claude.install":
  en: "Install Claude Code"
  fr: "Installer Claude Code"
"connect.claude.logged_in":
  en: "Signed in"
  fr: "Connecté"
"connect.claude.logged_in_with":
  en: "Signed in (%{method})"
  fr: "Connecté (%{method})"
"connect.claude.login":
  en: "Sign in"
  fr: "Se connecter"
"connect.claude.login_alt":
  en: "Or start `claude` and type /login. If it still does not show up here, update Claude Code:"
  fr: "Ou lance `claude` et tape /login. Si rien ne change ici, mets Claude Code à jour :"
"connect.claude.login_how":
  en: "In a terminal, this opens the browser to sign in to your Claude account:"
  fr: "Dans un terminal, ceci ouvre le navigateur pour te connecter à ton compte Claude :"
