"connect.other.how":
  en: "Any server speaking the OpenAI API (vLLM, LocalAI, Jan, another computer…): type its address in \"Server address\" below, ending in /v1."
  fr: "Tout serveur qui parle l'API OpenAI (vLLM, LocalAI, Jan, un autre ordinateur…) : tape son adresse dans « Adresse du serveur » plus bas, terminée par /v1."
"connect.other.start":
  en: "Reach the server"
  fr: "Joindre le serveur"
"connect.ready":
